[platformio]
default_envs = cores3se_unit

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 1500000
monitor_speed = 115200
board_build.flash_mode = qio
extra_scripts =
    pre:scripts/patch_esp_dmx_v202.py

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    M5Stack/M5Unified@0.2.21
    M5Stack/M5GFX@0.2.28
    https://github.com/someweisguy/esp_dmx/archive/refs/tags/v2.02.zip
; v4.1.0 test version - not used by full app
; https://github.com/someweisguy/esp_dmx/archive/refs/tags/v4.1.0.zip

[env:cores3se_unit]
build_flags =
    ${env.build_flags}
    -DDMX_HARDWARE_UNIT

[env:cores3se_base]
build_flags =
    ${env.build_flags}
    -DDMX_HARDWARE_BASE
