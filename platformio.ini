[env:cores3se]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 1500000
monitor_speed = 115200
board_build.flash_mode = qio

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    M5Stack/M5Unified
    M5Stack/M5GFX
    https://github.com/someweisguy/esp_dmx/archive/refs/tags/v2.02.zip
; v4.1.0 test version - not used by full app
; https://github.com/someweisguy/esp_dmx/archive/refs/tags/v4.1.0.zip
